<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Servicios Medicos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1668b7">
  <meta name="description" content="Buscador de Servicios Medicos del Hospital Municipal La Portada">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Buscador 2.0">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BDRL6VX3YR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BDRL6VX3YR');
  </script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H+</div>
        <div>
          <h1>Buscador de Servicios Medicos</h1>
          <p>Hospital Municipal La Portada · Desarrollado por : Marcelo Oviedo L.</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar modo">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">OSC</span>
      </button>
    </div>
  </header>

  <main class="app-shell">
    <section class="search-section" aria-label="Busqueda">
      <form class="search-form" id="searchForm">
        <label for="searchInput">Buscar por diagnostico, servicio o codigo</label>
        <div class="search-row">
          <div class="search-field">
            <input id="searchInput" type="search" placeholder="Ej: infeccion, A09, bronquitis..." autocomplete="off">
            <button class="clear-button" id="clearButton" type="button" aria-label="Limpiar busqueda">✕</button>
          </div>
          <button class="search-button" type="submit">Buscar</button>
        </div>
      </form>

      <div class="section-divider"></div>

      <div class="recent-block" id="recentBlock" hidden>
        <div class="section-title">
          <span>Busquedas recientes</span>
        </div>
        <div class="recent-list" id="recentList"></div>
      </div>

      <div class="section-divider"></div>

      <div class="filters" aria-label="Filtros de tipo de paciente">
        <span class="filter-label">Filtrar</span>
        <button class="filter-chip active" type="button" data-filter="todos">Todos</button>
        <button class="filter-chip" type="button" data-filter="ambulatorio">
          <span class="dot dot-amb"></span>Ambulatorio
        </button>
        <button class="filter-chip" type="button" data-filter="internado">
          <span class="dot dot-int"></span>Internado
        </button>
      </div>
    </section>

    <section class="status-row" aria-live="polite">
      <p id="resultCounter">Ingrese un termino y presione Buscar.</p>
      <p id="dataStatus" class="data-status visible">Cargando datos...</p>
    </section>

    <section id="results" class="results" aria-label="Resultados"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
